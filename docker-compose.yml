version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"       # API REST
      - "2575:2575"       # MLLP default port (HL7)
    environment:
      - DATABASE_URL=postgresql+asyncpg://healthflow:healthflow@postgres:5432/healthflow
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - postgres
      - nats
      - redis
    volumes:
      - ./backend:/app/backend

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: healthflow
      POSTGRES_USER: healthflow
      POSTGRES_PASSWORD: healthflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data

  nats:
    image: nats:latest
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4222:4222"     # Client
      - "8222:8222"     # HTTP monitoring
    volumes:
      - natsdata:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"     # gRPC
      - "4318:4318"     # HTTP
    volumes:
      - ./infra/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata:
  natsdata:
