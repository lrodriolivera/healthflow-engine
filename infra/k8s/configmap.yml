apiVersion: v1
kind: ConfigMap
metadata:
  name: healthflow-config
  namespace: healthflow
data:
  HF_LOG_LEVEL: "INFO"
  HF_NATS_URL: "nats://nats:4222"
  HF_REDIS_URL: "redis://redis:6379"
  HF_DATABASE_URL: "postgresql+asyncpg://healthflow:healthflow@postgres:5432/healthflow"
  HF_OTEL_ENDPOINT: "http://otel-collector:4317"
  HF_OTEL_SERVICE_NAME: "healthflow-engine"
  HF_MLLP_DEFAULT_PORT: "2575"
  HF_MLLP_ACK_MODE: "immediate"
  HF_BEDROCK_MODEL_SONNET: "us.anthropic.claude-sonnet-4-6-20250514-v1:0"
  HF_BEDROCK_MODEL_OPUS: "us.anthropic.claude-opus-4-6-20250514-v1:0"
