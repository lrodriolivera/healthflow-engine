apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: healthflow
  labels:
    app: healthflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthflow-frontend
  template:
    metadata:
      labels:
        app: healthflow-frontend
    spec:
      containers:
        - name: frontend
          image: healthflow-engine/frontend:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend:8000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: healthflow
spec:
  selector:
    app: healthflow-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
